aid: strand-ai
name: Strand AI
description: >-
  Strand AI (YC W26) builds multimodal foundation models for spatial biology that predict
  missing patient bio-data from the data a patient already has. Its Lattice model turns a single
  H&E-stained whole-slide image into per-pixel predictions for a panel of protein markers,
  recovering spatial protein signal without running multiplex immunofluorescence. The Strand
  Platform API is a production REST surface (https://app.strandai.com/api/v1) for uploading
  whole-slide images, estimating and submitting Lattice inference jobs, streaming job status over
  Server-Sent Events, and downloading OME-Zarr results as AnnData (Python) or SpatialExperiment
  (R). Access is invite-only, authenticated with organization-scoped bearer API keys, and metered
  in credits (1 credit per 224x224-px patch per marker). Official Python (strand-sdk) and R
  (strandai) clients are published. Outputs are for research and hypothesis generation, not
  clinical use.
